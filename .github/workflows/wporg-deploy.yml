# Uploads the plugin to WordPress.org (SVN) when a version tag like 1.1.3 is pushed: trunk, tags/<version>, and the
# directory's images (assets/, from .wordpress-org). Needs the repository secret SVN_PASSWORD
# (WordPress.org profile > Account & Security > SVN password).
name: Deploy to WordPress.org
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: pfkellogg          # public: the WordPress.org username
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: aikellogg-viewer-for-h5p
          ASSETS_DIR: .wordpress-org
