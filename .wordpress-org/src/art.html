<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
#icon,#banner{display:none}
.show{display:block!important}
</style></head><body>
<!-- the motif: a quiz card (a question line and three answers, the right ones ticked) under a magnifying glass -->
<svg id="icon" width="256" height="256" viewBox="0 0 256 256">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b7fcc"/><stop offset="1" stop-color="#1b5a99"/></linearGradient></defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <g transform="translate(34,40)">
    <rect width="150" height="170" rx="16" fill="#fff"/>
    <rect x="18" y="20" width="100" height="12" rx="6" fill="#1d2327" opacity=".85"/>
    <rect x="18" y="40" width="70" height="10" rx="5" fill="#1d2327" opacity=".35"/>
    <g font-family="Helvetica Neue,Arial" font-weight="900" font-size="26">
      <rect x="14" y="64" width="122" height="28" rx="7" fill="#e7f6ec"/><text x="22" y="87" fill="#00a32a">✓</text><rect x="50" y="74" width="72" height="9" rx="4.5" fill="#00a32a" opacity=".55"/>
      <rect x="14" y="98" width="122" height="28" rx="7" fill="#f6f7f7"/><text x="23" y="121" fill="#d63638">✕</text><rect x="50" y="108" width="60" height="9" rx="4.5" fill="#8c8f94" opacity=".55"/>
      <rect x="14" y="132" width="122" height="28" rx="7" fill="#e7f6ec"/><text x="22" y="155" fill="#00a32a">✓</text><rect x="50" y="142" width="66" height="9" rx="4.5" fill="#00a32a" opacity=".55"/>
    </g>
  </g>
  <g transform="translate(150,128)">
    <line x1="44" y1="44" x2="82" y2="82" stroke="#1d2327" stroke-width="22" stroke-linecap="round"/>
    <line x1="44" y1="44" x2="82" y2="82" stroke="#dba617" stroke-width="13" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="40" fill="rgba(255,255,255,.25)" stroke="#1d2327" stroke-width="14"/>
    <circle cx="20" cy="20" r="40" fill="none" stroke="#dba617" stroke-width="7"/>
  </g>
</svg>
<div id="banner" style="width:1544px;height:500px;position:relative;overflow:hidden;background:linear-gradient(120deg,#1b5a99 0%,#2271b1 55%,#2b7fcc 100%)">
  <div style="position:absolute;left:0;top:0;right:0;bottom:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2px);background-size:34px 34px"></div>
  <div style="position:absolute;left:110px;top:118px;color:#fff">
    <div style="font-size:30px;font-weight:800;letter-spacing:3px;color:#f0c53a;text-transform:uppercase">Free · Open source</div>
    <div style="font-size:104px;font-weight:900;line-height:1.05;margin-top:12px;letter-spacing:-2px">Viewer for H5P</div>
    <div style="font-size:38px;margin-top:20px;max-width:780px;line-height:1.3;color:#e8f1fb">See every question and answer on the page,<br>the right ones marked.</div>
  </div>
  <svg style="position:absolute;right:120px;top:40px" width="560" height="420" viewBox="0 0 560 420">
    <g transform="translate(40,20) rotate(-4)">
      <rect width="380" height="360" rx="26" fill="#fff" stroke="rgba(0,0,0,.08)"/>
      <rect x="0" y="0" width="380" height="56" rx="26" fill="#1d2327"/><rect x="0" y="30" width="380" height="26" fill="#1d2327"/>
      <rect x="28" y="20" width="160" height="16" rx="8" fill="#fff" opacity=".9"/>
      <rect x="28" y="82" width="250" height="16" rx="8" fill="#1d2327" opacity=".8"/>
      <rect x="28" y="108" width="170" height="13" rx="6.5" fill="#1d2327" opacity=".3"/>
      <g font-family="Helvetica Neue,Arial" font-weight="900" font-size="34">
        <rect x="22" y="140" width="336" height="52" rx="10" fill="#e7f6ec"/><text x="38" y="178" fill="#00a32a">✓</text><rect x="86" y="159" width="190" height="14" rx="7" fill="#00a32a" opacity=".55"/>
        <rect x="22" y="202" width="336" height="52" rx="10" fill="#f6f7f7"/><text x="40" y="240" fill="#d63638">✕</text><rect x="86" y="221" width="150" height="14" rx="7" fill="#8c8f94" opacity=".55"/>
        <rect x="22" y="264" width="336" height="52" rx="10" fill="#e7f6ec"/><text x="38" y="302" fill="#00a32a">✓</text><rect x="86" y="283" width="170" height="14" rx="7" fill="#00a32a" opacity=".55"/>
      </g>
    </g>
    <g transform="translate(360,215)">
      <line x1="70" y1="70" x2="135" y2="135" stroke="#1d2327" stroke-width="34" stroke-linecap="round"/>
      <line x1="70" y1="70" x2="135" y2="135" stroke="#dba617" stroke-width="20" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="64" fill="rgba(255,255,255,.28)" stroke="#1d2327" stroke-width="22"/>
      <circle cx="30" cy="30" r="64" fill="none" stroke="#dba617" stroke-width="11"/>
    </g>
  </svg>
</div>
<script>document.getElementById(new URLSearchParams(location.search).get('a')).classList.add('show')</script>
</body></html>
